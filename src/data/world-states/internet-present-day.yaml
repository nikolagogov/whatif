time:
  label: Present day
  year: 2026
  precision: year
description: >-
  Global communication is slower and more dependent on telephone,
  broadcast, and private networks. Access to knowledge depends more
  on libraries, institutions, geography, and wealth. Without a universal
  Web-based commerce and publishing ecosystem, the digital economy
  develops differently. Political discourse remains contested but is
  shaped more by traditional media and local organisations. International
  scientific research continues, but sharing and coordination are less
  immediate.
